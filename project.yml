name: Cockpit
options:
  bundleIdPrefix: dev.cockpit
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release
packages:
  CockpitKit:
    path: .
settings:
  base:
    PRODUCT_NAME: $(TARGET_NAME)
    COCKPIT_GHOSTTY_ARTIFACTS_DIR: $(PROJECT_TEMP_DIR)/$(CONFIGURATION)/CockpitGhosttyArtifacts.build/DerivedSources/Ghostty
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
configFiles:
  Debug: Config/Build/Debug.xcconfig
  Release: Config/Build/Release.xcconfig
aggregateTargets:
  CockpitGhosttyArtifacts:
    buildScripts:
      - name: Build Cockpit Ghostty Artifacts
        shell: /bin/zsh
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/ThirdParty/ghostty/.git
          - $(SRCROOT)/ThirdParty/ghostty/build.zig.zon
          - $(SRCROOT)/Patches/ghostty/series
          - $(SRCROOT)/Patches/ghostty/0001-cockpit-external-vt-renderer.patch
          - $(SRCROOT)/Native/CockpitGhosttyBridge/include/cockpit_ghostty.h
          - $(SRCROOT)/Native/CockpitGhosttyBridge/include/module.modulemap
          - $(SRCROOT)/Config/Toolchains/ghostty.env
          - $(SRCROOT)/Tools/build-ghostty-bridge.zsh
        outputFiles:
          - $(DERIVED_FILE_DIR)/Ghostty/include/CockpitGhostty/cockpit_ghostty.h
          - $(DERIVED_FILE_DIR)/Ghostty/include/CockpitGhostty/module.modulemap
          - $(DERIVED_FILE_DIR)/Ghostty/lib/libCockpitGhosttyVT.a
          - $(DERIVED_FILE_DIR)/Ghostty/CockpitGhosttyRenderer.xcframework
          - $(DERIVED_FILE_DIR)/Ghostty/manifest.json
        script: |
          set -euo pipefail
          test "$COCKPIT_GHOSTTY_ARTIFACTS_DIR" = "$DERIVED_FILE_DIR/Ghostty"
          "$SRCROOT/Tools/build-ghostty-bridge.zsh" \
            --configuration "$CONFIGURATION" \
            --output "$DERIVED_FILE_DIR/Ghostty"
targets:
  CockpitHost:
    type: tool
    platform: macOS
    sources: [Applications/CockpitHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cockpit.CockpitHost
        OTHER_CODE_SIGN_FLAGS: --identifier dev.cockpit.CockpitHost
    dependencies:
      - package: CockpitKit
        product: CockpitHostCore
      - package: CockpitKit
        product: CockpitLocalTransport
      - package: CockpitKit
        product: CockpitPersistence
      - package: CockpitKit
        product: CockpitWorkspace
  CockpitTerminalSupervisor:
    type: tool
    platform: macOS
    sources: [Applications/CockpitTerminalSupervisor]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cockpit.CockpitTerminalSupervisor
        OTHER_CODE_SIGN_FLAGS: --identifier dev.cockpit.CockpitTerminalSupervisor
    dependencies:
      - package: CockpitKit
        product: CockpitHostCore
      - package: CockpitKit
        product: CockpitTerminalCore
      - package: CockpitKit
        product: CockpitLocalTransport
      - package: CockpitKit
        product: CockpitPersistence
  CockpitPTYKeeper:
    type: tool
    platform: macOS
    sources: [Applications/CockpitPTYKeeper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cockpit.CockpitPTYKeeper
        OTHER_CODE_SIGN_FLAGS: --identifier dev.cockpit.CockpitPTYKeeper
        ARCHS: arm64
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) COCKPIT_GHOSTTY_LINKED
        SWIFT_INCLUDE_PATHS: $(inherited) $(COCKPIT_GHOSTTY_ARTIFACTS_DIR)/include/CockpitGhostty
        LIBRARY_SEARCH_PATHS: $(inherited) $(COCKPIT_GHOSTTY_ARTIFACTS_DIR)/lib
        OTHER_LDFLAGS: $(inherited) "$(COCKPIT_GHOSTTY_ARTIFACTS_DIR)/lib/libCockpitGhosttyVT.a"
    dependencies:
      - target: CockpitGhosttyArtifacts
      - package: CockpitKit
        product: CockpitTerminalCore
      - package: CockpitKit
        product: CockpitLocalTransport
  Cockpit:
    type: application
    platform: macOS
    sources:
      - Applications/CockpitApp
      - path: EditorRuntime/dist/MonacoRuntime.bundle
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cockpit.Cockpit
        GENERATE_INFOPLIST_FILE: YES
        LM_FORCE_LINK_GENERATION: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cockpit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ARCHS: arm64
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) COCKPIT_GHOSTTY_LINKED
        SWIFT_INCLUDE_PATHS: $(inherited) $(COCKPIT_GHOSTTY_ARTIFACTS_DIR)/include/CockpitGhostty
        LIBRARY_SEARCH_PATHS: $(inherited) $(COCKPIT_GHOSTTY_ARTIFACTS_DIR)/CockpitGhosttyRenderer.xcframework/macos-arm64
        OTHER_LDFLAGS: $(inherited) "$(COCKPIT_GHOSTTY_ARTIFACTS_DIR)/CockpitGhosttyRenderer.xcframework/macos-arm64/libCockpitGhosttyRenderer.a" -lc++
    dependencies:
      - target: CockpitGhosttyArtifacts
      - package: CockpitKit
        product: CockpitClientCore
      - package: CockpitKit
        product: CockpitHostCore
      - package: CockpitKit
        product: CockpitLocalTransport
      - package: CockpitKit
        product: CockpitTypes
      - package: CockpitKit
        product: CockpitTerminalClient
      - sdk: WebKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: CoreGraphics.framework
      - sdk: ServiceManagement.framework
      - target: CockpitHost
        embed: false
      - target: CockpitTerminalSupervisor
        embed: false
      - target: CockpitPTYKeeper
        embed: false
    postBuildScripts:
      - name: Embed LaunchAgents
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/CockpitHost
          - $(BUILT_PRODUCTS_DIR)/CockpitTerminalSupervisor
          - $(BUILT_PRODUCTS_DIR)/CockpitPTYKeeper
          - $(SRCROOT)/Config/LaunchAgents/dev.cockpit.host.plist
          - $(SRCROOT)/Config/LaunchAgents/dev.cockpit.terminal.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/CockpitHost
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/CockpitTerminalSupervisor
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/CockpitPTYKeeper
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/dev.cockpit.host.plist
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/dev.cockpit.terminal.plist
        script: |
          set -euo pipefail
          test -n "$WRAPPER_NAME"
          test "$CONTENTS_FOLDER_PATH" = "$WRAPPER_NAME/Contents"
          case "$TARGET_BUILD_DIR" in
            /*) ;;
            *) exit 1 ;;
          esac
          target_build_dir=$(/bin/realpath "$TARGET_BUILD_DIR")
          test "$target_build_dir" != "/"
          contents=$(/bin/realpath "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH")
          test "$contents" = "$target_build_dir/$WRAPPER_NAME/Contents"
          resources="$contents/Resources"
          agents="$contents/Library/LaunchAgents"
          test ! -L "$resources"
          test ! -L "$contents/Library"
          test ! -L "$agents"
          /bin/mkdir -p "$resources" "$agents"
          resources=$(/bin/realpath "$resources")
          agents=$(/bin/realpath "$agents")
          test "$resources" = "$contents/Resources"
          test "$agents" = "$contents/Library/LaunchAgents"
          /usr/bin/find "$agents" -mindepth 1 -maxdepth 1 -exec /bin/rm -rf {} +
          /bin/cp "$BUILT_PRODUCTS_DIR/CockpitHost" "$resources/CockpitHost"
          /bin/cp "$BUILT_PRODUCTS_DIR/CockpitTerminalSupervisor" "$resources/CockpitTerminalSupervisor"
          /bin/cp "$BUILT_PRODUCTS_DIR/CockpitPTYKeeper" "$resources/CockpitPTYKeeper"
          /bin/cp "$SRCROOT/Config/LaunchAgents/dev.cockpit.host.plist" "$agents/"
          /bin/cp "$SRCROOT/Config/LaunchAgents/dev.cockpit.terminal.plist" "$agents/"
  CockpitAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/CockpitAppTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cockpit.CockpitTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cockpit.app/Contents/MacOS/Cockpit
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_INCLUDE_PATHS: $(inherited) $(COCKPIT_GHOSTTY_ARTIFACTS_DIR)/include/CockpitGhostty
    dependencies:
      - target: Cockpit
      - sdk: WebKit.framework
schemes:
  Cockpit:
    build:
      targets:
        Cockpit: all
        CockpitHost: all
        CockpitTerminalSupervisor: all
        CockpitPTYKeeper: all
    run:
      config: Debug
    test:
      config: Debug
      commandLineArguments:
        -XCTDisableAggressiveSymbolication: true
        YES: true
      targets:
        - CockpitAppTests
