syntax = "proto3";
package cockpit.protocol.v1;
option swift_prefix = "CP";

import "google/protobuf/timestamp.proto";

message HandshakeRequest {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string device_id = 3;
  repeated string requested_features = 4;
}

message HandshakeResponse {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string connection_id = 3;
  repeated string accepted_features = 4;
  string service_kind = 5;
}

message ProtocolError {
  enum Code {
    UNSPECIFIED = 0;
    INCOMPATIBLE_MAJOR_VERSION = 1;
    INVALID_IDENTITY = 2;
    MALFORMED_MESSAGE = 3;
    UNAUTHORIZED = 4;
  }

  Code code = 1;
  string message = 2;
}

message WorkspaceContextID {
  oneof kind {
    string project_id = 1;
    string conversation_id = 2;
  }
}

message RequestContext {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string client_instance_id = 3;
  string window_id = 4;
  WorkspaceContextID workspace_context_id = 5;
  string environment_id = 6;
  uint64 active_context_generation = 7;
  string request_id = 8;
}

enum TerminalKeyAction {
  TERMINAL_KEY_ACTION_UNSPECIFIED = 0;
  TERMINAL_KEY_ACTION_PRESS = 1;
  TERMINAL_KEY_ACTION_REPEAT = 2;
  TERMINAL_KEY_ACTION_RELEASE = 3;
}

message TerminalKeyEvent {
  uint32 logical_key = 1;
  uint32 physical_key = 2;
  uint32 modifiers = 3;
  TerminalKeyAction action = 4;
}

enum TerminalMouseAction {
  TERMINAL_MOUSE_ACTION_UNSPECIFIED = 0;
  TERMINAL_MOUSE_ACTION_PRESS = 1;
  TERMINAL_MOUSE_ACTION_RELEASE = 2;
  TERMINAL_MOUSE_ACTION_MOTION = 3;
  TERMINAL_MOUSE_ACTION_SCROLL = 4;
}

message TerminalMouseEvent {
  int32 cell_x = 1;
  int32 cell_y = 2;
  uint32 buttons = 3;
  sint32 wheel_x = 4;
  sint32 wheel_y = 5;
  uint32 modifiers = 6;
  TerminalMouseAction action = 7;
}

message TerminalResize {
  uint32 columns = 1;
  uint32 rows = 2;
}

enum TerminalSignal {
  TERMINAL_SIGNAL_UNSPECIFIED = 0;
  TERMINAL_SIGNAL_INTERRUPT = 1;
  TERMINAL_SIGNAL_QUIT = 2;
  TERMINAL_SIGNAL_SUSPEND = 3;
  TERMINAL_SIGNAL_CONTINUE = 4;
}

message TerminalInput {
  RequestContext context = 1;
  string terminal_session_id = 2;
  string input_lease_id = 3;
  uint64 input_sequence = 4;

  oneof payload {
    string text = 5;
    TerminalKeyEvent key = 6;
    string paste = 7;
    TerminalMouseEvent mouse = 8;
    TerminalResize resize = 9;
    TerminalSignal signal = 10;
  }
}

message TerminalArchiveChunk {
  string name = 1;
  uint64 first_output_sequence = 2;
  uint64 last_output_sequence = 3;
  bytes sha256 = 4;
}

message TerminalExitStatus {
  oneof result {
    uint32 exit_code = 1;
    int32 darwin_signal = 2;
  }
}

message TerminalArchiveManifest {
  string terminal_session_id = 1;
  string worker_instance_id = 2;
  uint64 first_output_sequence = 3;
  uint64 latest_output_sequence = 4;
  repeated TerminalArchiveChunk chunks = 5;
  bytes final_snapshot_sha256 = 6;
  TerminalExitStatus exit_status = 7;
  google.protobuf.Timestamp completed_at = 8;
}

message DocumentRecoveryRecord {
  bytes magic = 1;
  uint32 format_version = 2;
  string document_id = 3;
  uint64 document_version = 4;
  uint64 client_sequence = 5;
  bytes record_sha256 = 6;
  bytes utf8_edit_payload = 7;
}

message DocumentRecoveryCheckpoint {
  bytes magic = 1;
  uint32 format_version = 2;
  string document_id = 3;
  uint64 persisted_document_version = 4;
  uint64 persisted_client_sequence = 5;
  uint64 device_id = 6;
  uint64 inode = 7;
  uint64 byte_count = 8;
  sint64 modification_time_seconds = 9;
  uint32 modification_time_nanoseconds = 10;
  bytes content_sha256 = 11;
  bytes checkpoint_sha256 = 12;
  bytes persisted_document_bytes = 13;
}

message DataPlaneBinding {
  string client_instance_id = 1;
  string window_id = 2;
  WorkspaceContextID workspace_context_id = 3;
  string environment_id = 4;
  uint64 active_context_generation = 5;
}

message HostDataPlaneTicketRequest { RequestContext context = 1; }
message HostDataPlaneTicketResponse {
  string socket_path = 1;
  string ticket = 2;
  uint32 valid_for_milliseconds = 3;
}
message HostDataPlaneAuthenticate {
  string ticket = 1;
  DataPlaneBinding binding = 2;
}
message HostDataPlaneAuthenticated { DataPlaneBinding binding = 1; }

enum DataPlaneErrorCode {
  DATA_PLANE_ERROR_CODE_UNSPECIFIED = 0;
  DATA_PLANE_ERROR_CODE_MALFORMED_MESSAGE = 1;
  DATA_PLANE_ERROR_CODE_WRONG_CHANNEL = 2;
  DATA_PLANE_ERROR_CODE_SEQUENCE_VIOLATION = 3;
  DATA_PLANE_ERROR_CODE_ACK_VIOLATION = 4;
  DATA_PLANE_ERROR_CODE_UNAUTHORIZED_PEER = 5;
  DATA_PLANE_ERROR_CODE_INVALID_TICKET = 6;
  DATA_PLANE_ERROR_CODE_TICKET_EXPIRED = 7;
  DATA_PLANE_ERROR_CODE_TICKET_REPLAY = 8;
  DATA_PLANE_ERROR_CODE_CONTEXT_MISMATCH = 9;
  DATA_PLANE_ERROR_CODE_ENVIRONMENT_MISMATCH = 10;
  DATA_PLANE_ERROR_CODE_GENERATION_MISMATCH = 11;
  DATA_PLANE_ERROR_CODE_REQUEST_ID_REUSE = 12;
  DATA_PLANE_ERROR_CODE_DOCUMENT_NOT_OPEN = 20;
  DATA_PLANE_ERROR_CODE_DOCUMENT_INVALID_VALUE = 21;
  DATA_PLANE_ERROR_CODE_DOCUMENT_INVALID_LEASE = 22;
  DATA_PLANE_ERROR_CODE_DOCUMENT_LEASE_HELD = 23;
  DATA_PLANE_ERROR_CODE_DOCUMENT_BASE_VERSION_MISMATCH = 24;
  DATA_PLANE_ERROR_CODE_DOCUMENT_SEQUENCE_GAP = 25;
  DATA_PLANE_ERROR_CODE_DOCUMENT_DUPLICATE_MISMATCH = 26;
  DATA_PLANE_ERROR_CODE_DOCUMENT_STALE_SEQUENCE = 27;
  DATA_PLANE_ERROR_CODE_DOCUMENT_RECOVERY_REQUIRED = 28;
  DATA_PLANE_ERROR_CODE_DOCUMENT_RESYNCHRONIZING = 29;
  DATA_PLANE_ERROR_CODE_DOCUMENT_READ_ONLY = 30;
  DATA_PLANE_ERROR_CODE_DOCUMENT_FILE_MISSING = 31;
  DATA_PLANE_ERROR_CODE_DOCUMENT_FINGERPRINT_MISMATCH = 32;
  DATA_PLANE_ERROR_CODE_TREE_ZERO_GENERATION = 40;
  DATA_PLANE_ERROR_CODE_TREE_SYMBOLIC_LINK = 41;
  DATA_PLANE_ERROR_CODE_TREE_REVISION_UNAVAILABLE = 42;
  DATA_PLANE_ERROR_CODE_TREE_EVENT_SOURCE_UNAVAILABLE = 43;
  DATA_PLANE_ERROR_CODE_TREE_ENUMERATION_FAILED = 44;
  DATA_PLANE_ERROR_CODE_TREE_BACKPRESSURE = 45;
  DATA_PLANE_ERROR_CODE_REQUEST_CANCELLED = 50;
  DATA_PLANE_ERROR_CODE_INTERNAL = 60;
}

message DataPlaneError {
  DataPlaneErrorCode code = 1;
  optional uint64 expected = 2;
  optional uint64 actual = 3;
  DocumentAcknowledgement committed_acknowledgement = 4;
}
message EmptyResult {}
message HostDataPlaneControlEnvelope {
  oneof payload {
    HandshakeRequest handshake_request = 1;
    HandshakeResponse handshake_response = 2;
    HostDataPlaneAuthenticate authenticate = 3;
    HostDataPlaneAuthenticated authenticated = 4;
    DataPlaneError error = 5;
  }
}

message UTF16TextChange {
  uint64 offset = 1;
  uint64 length = 2;
  string replacement = 3;
}
message DiskFingerprintValue {
  uint64 device_id = 1;
  uint64 inode = 2;
  uint64 byte_count = 3;
  sint64 modification_time_seconds = 4;
  uint32 modification_time_nanoseconds = 5;
  bytes content_sha256 = 6;
}
message EditLeaseValue {
  string edit_lease_id = 1;
  string document_id = 2;
  string client_instance_id = 3;
}
enum DocumentDirtyStateValue {
  DOCUMENT_DIRTY_STATE_VALUE_UNSPECIFIED = 0;
  DOCUMENT_DIRTY_STATE_VALUE_CLEAN = 1;
  DOCUMENT_DIRTY_STATE_VALUE_DIRTY = 2;
  DOCUMENT_DIRTY_STATE_VALUE_CONFLICT = 3;
  DOCUMENT_DIRTY_STATE_VALUE_MISSING = 4;
}
enum DocumentMaintenanceStateValue {
  DOCUMENT_MAINTENANCE_STATE_VALUE_UNSPECIFIED = 0;
  DOCUMENT_MAINTENANCE_STATE_VALUE_TRUNCATED_RECOVERY_TAIL = 1;
  DOCUMENT_MAINTENANCE_STATE_VALUE_CORRUPT_RECOVERY_RECORD = 2;
  DOCUMENT_MAINTENANCE_STATE_VALUE_COMPACTION_DEFERRED = 3;
}
message DocumentSnapshotValue {
  string document_id = 1;
  string environment_id = 2;
  string relative_path = 3;
  string text = 4;
  uint64 document_version = 5;
  uint64 persisted_version = 6;
  uint64 last_accepted_client_sequence = 7;
  DocumentDirtyStateValue dirty_state = 8;
  DiskFingerprintValue observed_disk_fingerprint = 9;
  EditLeaseValue current_lease = 10;
  repeated DocumentMaintenanceStateValue maintenance = 11;
}
message DocumentAcknowledgement {
  string document_id = 1;
  uint64 client_sequence = 2;
  uint64 document_version = 3;
}
message DocumentOpenRequest { string relative_path = 1; }
message DocumentSnapshotRequest { string document_id = 1; }
message DocumentAcquireLeaseRequest {
  string document_id = 1;
  reserved 2;
}
message DocumentTransferLeaseRequest {
  string document_id = 1;
  string from_edit_lease_id = 2;
  string target_client_instance_id = 3;
}
message DocumentApplyRequest {
  string document_id = 1;
  string edit_lease_id = 2;
  uint64 base_version = 3;
  uint64 client_sequence = 4;
  repeated UTF16TextChange changes = 5;
}
message DocumentFlushRequest {
  string document_id = 1;
  uint64 through_client_sequence = 2;
}
message DocumentFlushResult { uint64 document_version = 1; }
message DocumentSaveRequest {
  string document_id = 1;
  DiskFingerprintValue expected_fingerprint = 2;
}
message DocumentDiscardRequest { string document_id = 1; }
message DocumentViewerRetainRequest { string document_id = 1; }
message DocumentViewerReleaseRequest { string document_id = 1; }
message DocumentViewerResult { string document_id = 1; }
message DocumentEnvelope {
  string request_id = 1;
  DataPlaneBinding binding = 2;
  oneof payload {
    DocumentOpenRequest open_request = 10;
    DocumentSnapshotRequest snapshot_request = 11;
    DocumentAcquireLeaseRequest acquire_lease_request = 12;
    DocumentTransferLeaseRequest transfer_lease_request = 13;
    DocumentApplyRequest apply_request = 14;
    DocumentFlushRequest flush_request = 15;
    DocumentSaveRequest save_request = 16;
    DocumentDiscardRequest discard_request = 17;
    DocumentViewerRetainRequest retain_viewer_request = 18;
    DocumentViewerReleaseRequest release_viewer_request = 19;
    DocumentSnapshotValue snapshot_result = 30;
    EditLeaseValue lease_result = 31;
    DocumentAcknowledgement acknowledgement_result = 32;
    DocumentFlushResult flush_result = 33;
    DocumentViewerResult viewer_result = 34;
    DataPlaneError error = 40;
  }
}

enum WorkspaceDirectoryKind {
  WORKSPACE_DIRECTORY_KIND_UNSPECIFIED = 0;
  WORKSPACE_DIRECTORY_KIND_ROOT = 1;
  WORKSPACE_DIRECTORY_KIND_RELATIVE = 2;
}
message WorkspaceDirectoryValue {
  WorkspaceDirectoryKind kind = 1;
  optional string relative_path = 2;
}
enum FileTreeEntryKindValue {
  FILE_TREE_ENTRY_KIND_VALUE_UNSPECIFIED = 0;
  FILE_TREE_ENTRY_KIND_VALUE_FILE = 1;
  FILE_TREE_ENTRY_KIND_VALUE_DIRECTORY = 2;
  FILE_TREE_ENTRY_KIND_VALUE_SYMBOLIC_LINK = 3;
}
message FileTreeEntryIdentityValue {
  string environment_id = 1;
  string relative_path = 2;
}
message FileTreeEntryValue {
  FileTreeEntryIdentityValue identity = 1;
  FileTreeEntryKindValue kind = 2;
}
message FileTreeMutationValue {
  oneof mutation {
    FileTreeEntryValue insert = 1;
    FileTreeEntryIdentityValue remove = 2;
    FileTreeEntryValue update = 3;
  }
}
message FileTreeSnapshotValue {
  string environment_id = 1;
  WorkspaceDirectoryValue directory = 2;
  uint64 generation = 3;
  uint64 revision = 4;
  repeated FileTreeEntryValue children = 5;
}
message FileTreeDeltaValue {
  string environment_id = 1;
  WorkspaceDirectoryValue directory = 2;
  uint64 revision = 3;
  repeated FileTreeMutationValue mutations = 4;
}
message FileTreeChildrenRequest { WorkspaceDirectoryValue directory = 1; }
message FileTreeSubscribeRequest { uint64 after_revision = 1; }
message FileTreeSubscriptionAccepted {
  string subscription_id = 1;
  uint64 revision = 2;
}
message FileTreeDeltaEvent {
  string subscription_id = 1;
  string event_id = 2;
  FileTreeDeltaValue delta = 3;
}
message FileTreeDeltaAck {
  string subscription_id = 1;
  string event_id = 2;
  uint64 revision = 3;
}
message FileTreeAckAccepted {
  string subscription_id = 1;
  string event_id = 2;
  uint64 revision = 3;
}
message FileTreeCancelRequest { string subscription_id = 1; }
message FileTreeCancelled { string subscription_id = 1; }
message FileTreeEnvelope {
  string request_id = 1;
  DataPlaneBinding binding = 2;
  oneof payload {
    FileTreeChildrenRequest children_request = 10;
    FileTreeSubscribeRequest subscribe_request = 11;
    FileTreeDeltaAck delta_ack = 12;
    FileTreeCancelRequest cancel_request = 13;
    FileTreeSnapshotValue snapshot_result = 30;
    FileTreeSubscriptionAccepted subscription_accepted = 31;
    FileTreeDeltaEvent delta_event = 32;
    FileTreeAckAccepted ack_accepted = 33;
    FileTreeCancelled cancelled = 34;
    DataPlaneError error = 40;
  }
}
